<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday — Kejutan Spesial Untukmu</title>
  <style>
    :root{
      --bg1:#fff6f8;
      --bg2:#ffeef3;
      --accent:#ff5c8a;
      --accent2:#ff8fab;
      --ink:#2b1e24;
      --muted:#6d5560;
      --card:#ffffffd9;
      --shadow: 0 24px 60px rgba(255, 77, 130, 0.16);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }

    body{
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, -apple-system, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at 15% 10%, #ffd6e4 0%, transparent 60%),
        radial-gradient(800px 600px at 85% 15%, #ffe6d6 0%, transparent 58%),
        radial-gradient(900px 700px at 50% 95%, #ffdbe8 0%, transparent 62%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100%;
      overflow-x:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px 48px;
    }

    /* Floating ambient hearts & sparkles */
    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .float-item{
      position:absolute;
      bottom:-40px;
      opacity:0;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 6px 12px rgba(255,92,138,0.18));
      user-select:none;
    }

    @keyframes floatUp{
      0%{
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.85);
        opacity:0;
      }
      12%{ opacity:0.85; }
      50%{ transform: translateY(-50vh) translateX(18px) rotate(12deg) scale(1); }
      88%{ opacity:0.8; }
      100%{
        transform: translateY(-110vh) translateX(-14px) rotate(-10deg) scale(0.95);
        opacity:0;
      }
    }

    /* Confetti canvas */
    #confetti{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:20;
    }

    .stage{
      position:relative;
      z-index:2;
      width:100%;
      max-width:720px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:24px;
    }

    /* Top badge */
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 16px;
      border-radius:999px;
      background:rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,92,138,0.22);
      color:var(--accent);
      font-weight:700;
      font-size:13px;
      letter-spacing:0.3px;
      box-shadow: 0 8px 24px rgba(255,92,138,0.1);
    }

    /* Gift box container */
    .gift-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      margin: 6px 0;
      transition: transform 0.5s cubic-bezier(.22,1,.36,1), opacity 0.45s ease;
    }

    .gift-btn{
      position:relative;
      width:176px;
      height:176px;
      background:none;
      border:none;
      cursor:pointer;
      outline:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s ease;
    }

    .gift-btn:hover{
      transform: scale(1.05) translateY(-3px);
    }

    .gift-btn:active{
      transform: scale(0.97);
    }

    .gift-shadow{
      position:absolute;
      bottom:6px;
      left:50%;
      transform:translateX(-50%);
      width:128px;
      height:24px;
      background: radial-gradient(ellipse at center, rgba(160, 42, 82, 0.28) 0%, transparent 72%);
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .gift-box{
      position:absolute;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      width:132px;
      height:104px;
      border-radius:14px;
      background: linear-gradient(145deg, #ff759f, #ff477e);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.45),
        0 14px 28px rgba(255, 71, 126, 0.32);
      overflow:hidden;
    }

    /* Vertical ribbon on box */
    .gift-box::before{
      content:"";
      position:absolute;
      top:0; bottom:0; left:50%;
      transform:translateX(-50%);
      width:24px;
      background: linear-gradient(180deg, #fff6d6, #ffd166);
    }

    /* Horizontal subtle sheen */
    .gift-box::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(120deg, rgba(255,255,255,0.28) 0%, transparent 45%);
    }

    .gift-lid{
      position:absolute;
      bottom:114px;
      left:50%;
      transform:translateX(-50%);
      width:148px;
      height:34px;
      border-radius:10px;
      background: linear-gradient(145deg, #ff85a9, #ff5c8a);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.5),
        0 8px 18px rgba(255, 71, 126, 0.25);
      transform-origin: 20% 90%;
      transition: transform 0.7s cubic-bezier(.22,1.25,.36,1), opacity 0.5s ease;
      z-index:3;
    }

    .gift-lid::before{
      content:"";
      position:absolute;
      top:0; bottom:0; left:50%;
      transform:translateX(-50%);
      width:24px;
      background: linear-gradient(180deg, #fff6d6, #ffd166);
    }

    /* Bow on top */
    .bow{
      position:absolute;
      top:-18px;
      left:50%;
      transform:translateX(-50%);
      width:74px;
      height:26px;
      z-index:4;
    }

    .bow::before,
    .bow::after{
      content:"";
      position:absolute;
      top:2px;
      width:34px;
      height:22px;
      border:6px solid #ffd166;
      border-radius:20px 20px 4px 20px;
      box-shadow: 0 4px 10px rgba(230, 165, 25, 0.25);
    }

    .bow::before{
      left:2px;
      transform:rotate(-14deg);
    }

    .bow::after{
      right:2px;
      transform:scaleX(-1) rotate(-14deg);
    }

    .bow-knot{
      position:absolute;
      top:6px;
      left:50%;
      transform:translateX(-50%);
      width:16px;
      height:16px;
      border-radius:5px;
      background:#ffe082;
      box-shadow:0 3px 8px rgba(0,0,0,0.12);
    }

    /* Idle gentle wiggle before opening */
    body:not(.opened) .gift-btn{
      animation: wiggle 2.8s ease-in-out infinite;
    }

    @keyframes wiggle{
      0%, 82%, 100%{ transform: rotate(0deg) translateY(0); }
      85%{ transform: rotate(-4deg) translateY(-3px); }
      89%{ transform: rotate(4deg) translateY(-4px); }
      93%{ transform: rotate(-2.5deg) translateY(-2px); }
      97%{ transform: rotate(2deg) translateY(0); }
    }

    body.opened .gift-lid{
      transform: translateX(-62%) translateY(-54px) rotate(-36deg);
      opacity:0;
    }

    body.opened .gift-box{
      transform: translateX(-50%) scale(0.9);
      opacity:0;
      transition: transform 0.5s ease 0.12s, opacity 0.45s ease 0.12s;
    }

    body.opened .gift-shadow{
      opacity:0;
      transform: translateX(-50%) scale(0.5);
    }

    body.opened .gift-wrap{
      max-height:0;
      margin:0;
      gap:0;
      overflow:hidden;
      opacity:0;
      pointer-events:none;
      transition: max-height 0.6s ease 0.25s, opacity 0.35s ease, margin 0.6s ease 0.25s;
    }

    .gift-hint{
      font-size:14px;
      font-weight:600;
      color:var(--muted);
      text-align:center;
      transition: opacity 0.3s ease;
    }

    /* Main Birthday Card */
    .card{
      width:100%;
      background:var(--card);
      backdrop-filter: blur(18px);
      border:1px solid rgba(255,255,255,0.9);
      border-radius:32px;
      padding:34px 30px 32px;
      box-shadow:var(--shadow);
      opacity:0;
      transform: translateY(26px) scale(0.97);
      transition: opacity 0.75s cubic-bezier(.22,1,.36,1) 0.18s,
                  transform 0.75s cubic-bezier(.22,1,.36,1) 0.18s;
      display:none;
    }

    body.opened .card{
      display:block;
    }

    body.opened.card-visible .card{
      opacity:1;
      transform: translateY(0) scale(1);
    }

    .card-header{
      text-align:center;
      margin-bottom:22px;
    }

    .cake-emoji{
      font-size:48px;
      line-height:1.1;
      display:inline-block;
      animation: popIn 0.7s cubic-bezier(.22,1.3,.36,1) both;
    }

    @keyframes popIn{
      0%{ transform:scale(0.3) rotate(-12deg); opacity:0; }
      100%{ transform:scale(1) rotate(0deg); opacity:1; }
    }

    h1{
      margin-top:8px;
      font-size: clamp(28px, 5vw, 42px);
      line-height:1.15;
      font-weight:800;
      background: linear-gradient(135deg, #ff3b77, #ff759f, #ff9ebb);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .subtitle{
      margin-top:8px;
      font-size:15px;
      color:var(--muted);
      font-weight:600;
    }

    /* Letter box */
    .letter{
      background: linear-gradient(180deg, #fff9fb 0%, #fff2f6 100%);
      border:1px solid rgba(255, 92, 138, 0.16);
      border-radius:22px;
      padding:24px 24px;
      font-size:16px;
      line-height:1.8;
      color:#3a2730;
      min-height:170px;
      position:relative;
    }

    .letter p + p{
      margin-top:14px;
    }

    .cursor{
      display:inline-block;
      width:2px;
      height:1.1em;
      background:var(--accent);
      margin-left:2px;
      vertical-align:text-bottom;
      animation: blink 0.85s steps(1) infinite;
    }

    @keyframes blink{
      50%{ opacity:0; }
    }

    /* Wishes pills */
    .wishes{
      margin-top:22px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
    }

    .wish-pill{
      padding:9px 14px;
      border-radius:999px;
      background:#ffffff;
      border:1px solid rgba(255,92,138,0.18);
      font-size:13.5px;
      font-weight:700;
      color:#593b48;
      box-shadow:0 6px 16px rgba(255,92,138,0.08);
    }

    /* Footer actions */
    .actions{
      margin-top:26px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding-top:18px;
      border-top:1px dashed rgba(255,92,138,0.22);
    }

    .sign{
      font-size:14px;
      color:var(--muted);
      font-weight:600;
    }

    .sign strong{
      color:var(--ink);
      font-size:15px;
    }

    .btn-group{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .btn{
      border:none;
      cursor:pointer;
      font-family:inherit;
      font-weight:700;
      font-size:14px;
      padding:11px 18px;
      border-radius:999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      display:inline-flex;
      align-items:center;
      gap:7px;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn:active{
      transform:translateY(0);
    }

    .btn-primary{
      background:linear-gradient(135deg, #ff4d82, #ff7aa2);
      color:#fff;
      box-shadow:0 10px 22px rgba(255,77,130,0.28);
    }

    .btn-soft{
      background:#fff;
      color:var(--accent);
      border:1px solid rgba(255,92,138,0.25);
      box-shadow:0 6px 16px rgba(255,92,138,0.08);
    }

    /* Music dock & frame */
    .music-dock{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:15;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.gift-locked .music-dock{
      opacity:0;
      pointer-events:none;
      transform:translateY(14px);
    }

    .music-frame{
      width:240px;
      height:135px;
      border-radius:16px;
      overflow:hidden;
      background:#ffffffd9;
      border:1px solid rgba(255,92,138,0.25);
      box-shadow:0 14px 32px rgba(255,77,130,0.2);
    }

    .music-frame iframe{
      width:100%;
      height:100%;
      display:block;
      border:0;
    }

    /* Toast */
    .toast{
      position:fixed;
      bottom:24px;
      left:50%;
      transform:translateX(-50%) translateY(20px);
      background:#2b1e24;
      color:#fff;
      padding:10px 18px;
      border-radius:999px;
      font-size:13.5px;
      font-weight:600;
      opacity:0;
      pointer-events:none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index:30;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media (max-width:520px){
      .card{ padding:26px 20px 24px; border-radius:26px; }
      .letter{ padding:18px 16px; font-size:15px; }
      .actions{ flex-direction:column; align-items:flex-start; }
      .music-dock{ right:12px; bottom:12px; }
      .music-frame{ width:192px; height:108px; }
    }
  </style>
</head>
<body class="gift-locked">
  <canvas id="confetti"></canvas>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <main class="stage">
    <div class="badge">✨ Spesial Hari Ulang Tahunmu ✨</div>

    <div class="gift-wrap" id="giftWrap">
      <button class="gift-btn" id="openGiftBtn" aria-label="Buka kado ulang tahun">
        <div class="gift-lid">
          <div class="bow">
            <div class="bow-knot"></div>
          </div>
        </div>
        <div class="gift-box"></div>
        <div class="gift-shadow"></div>
      </button>
      <p class="gift-hint" id="giftHint">Ketuk kotak kadonya untuk membuka kejutan 🎁</p>
    </div>

    <article class="card" id="birthdayCard" aria-live="polite">
      <header class="card-header">
        <div class="cake-emoji">🎂</div>
        <h1 id="headline">Selamat Ulang Tahun!</h1>
        <p class="subtitle" id="subline">Semoga hari-harimu selalu dipenuhi hangat, tawa, dan hal-hal baik.</p>
      </header>

      <section class="letter" id="letterBox"></section>

      <div class="wishes">
        <span class="wish-pill">🌸 Sehat Selalu</span>
        <span class="wish-pill">✨ Bahagia &amp; Tenang</span>
        <span class="wish-pill">🌈 Tercapai Semua Mimpi</span>
        <span class="wish-pill">🍀 Dikelilingi Orang Baik</span>
      </div>

      <footer class="actions">
        <div class="sign">
          Dengan hangat,<br />
          <strong id="senderName">Untuk Kamu yang Spesial</strong>
        </div>

        <div class="btn-group">
          <button class="btn btn-soft" id="celebrateBtn" type="button">🎉 Tabur Konfeti</button>
          <button class="btn btn-primary" id="replayBtn" type="button">↻ Ulangi Pesan</button>
        </div>
      </footer>
    </article>
  </main>

  <!-- Pemutar Musik -->
  <div class="music-dock" aria-label="Pemutar Musik">
    <div class="music-frame">
      <iframe
        id="ytPlayer"
        width="240"
        height="135"
        src="https://www.youtube.com/embed/B8XcrauYovA?enablejsapi=1&loop=1&playlist=B8XcrauYovA"
        title="Charlie Puth - One Call Away (Piano Cover by Pianella Piano)"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // =================================================================
    // KAMU BISA MENGGANTI TEKS UCAPAN DI BAWAH INI SESUAI KEINGINANMU
    // =================================================================
    const CONFIG = {
      headline: "Selamat Ulang Tahun! 🎈",
      subline: "Hari ini adalah perayaan kecil untuk semua cerita dan langkah hebatmu.",
      sender: "Dari Seseorang yang Peduli",
      paragraphs: [
        "Selamat bertambah usia ya! Semoga di tahun yang baru ini, setiap langkahmu terasa lebih ringan, hatimu lebih lapang, dan hal-hal yang kamu usahakan pelan-pelan menemukan jalannya.",
        "Terima kasih sudah bertahan, bertumbuh, dan membawa warna tersendiri di hari-hari sekitar. Jangan lupa beri jeda untuk beristirahat dan merayakan dirimu sendiri hari ini.",
        "Semoga selalu sehat, dikelilingi tawa yang tulus, dan dipertemukan dengan banyak kabar baik. Happy birthday! 💖"
      ]
    };
    // =================================================================

    const headlineEl = document.getElementById("headline");
    const sublineEl = document.getElementById("subline");
    const senderEl = document.getElementById("senderName");
    const letterBox = document.getElementById("letterBox");
    const openGiftBtn = document.getElementById("openGiftBtn");
    const celebrateBtn = document.getElementById("celebrateBtn");
    const replayBtn = document.getElementById("replayBtn");
    const toastEl = document.getElementById("toast");
    const ytPlayer = document.getElementById("ytPlayer");

    headlineEl.textContent = CONFIG.headline;
    sublineEl.textContent = CONFIG.subline;
    senderEl.textContent = CONFIG.sender;

    // Ambient floating emojis
    const ambientEl = document.getElementById("ambient");
    const glyphs = ["💖", "✨", "🌸", "🎀", "🌷", "💫"];
    for (let i = 0; i < 18; i++) {
      const span = document.createElement("span");
      span.className = "float-item";
      span.textContent = glyphs[i % glyphs.length];
      span.style.left = `${Math.random() * 100}%`;
      span.style.fontSize = `${14 + Math.random() * 14}px`;
      span.style.animationDuration = `${9 + Math.random() * 9}s`;
      span.style.animationDelay = `${Math.random() * 8}s`;
      ambientEl.appendChild(span);
    }

    // Typewriter effect for paragraphs
    let typingTimer = null;
    let isTyping = false;

    function clearTyping() {
      if (typingTimer) {
        clearTimeout(typingTimer);
        typingTimer = null;
      }
      isTyping = false;
    }

    function renderInstant() {
      clearTyping();
      letterBox.innerHTML = CONFIG.paragraphs
        .map(text => `<p>${escapeHtml(text)}</p>`)
        .join("");
    }

    function typeLetter() {
      clearTyping();
      isTyping = true;
      letterBox.innerHTML = "";

      const pElements = CONFIG.paragraphs.map(() => {
        const p = document.createElement("p");
        letterBox.appendChild(p);
        return p;
      });

      const cursor = document.createElement("span");
      cursor.className = "cursor";

      let pIdx = 0;
      let cIdx = 0;

      function step() {
        if (pIdx >= CONFIG.paragraphs.length) {
          cursor.remove();
          isTyping = false;
          return;
        }

        const currentP = pElements[pIdx];
        const fullText = CONFIG.paragraphs[pIdx];

        if (!currentP.contains(cursor)) {
          currentP.appendChild(cursor);
        }

        if (cIdx < fullText.length) {
          cursor.insertAdjacentText("beforebegin", fullText[cIdx]);
          cIdx++;
          const ch = fullText[cIdx - 1];
          const delay = ch === "." || ch === "!" || ch === "?" ? 140 : ch === "," ? 75 : 26;
          typingTimer = setTimeout(step, delay);
        } else {
          cursor.remove();
          pIdx++;
          cIdx = 0;
          typingTimer = setTimeout(step, 260);
        }
      }

      step();
    }

    // Klik pada kotak surat saat sedang mengetik untuk langsung menampilkan semua teks
    letterBox.addEventListener("click", () => {
      if (isTyping) {
        renderInstant();
        showToast("Seluruh pesan ditampilkan ✨");
      }
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    // Confetti system
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let animId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const palette = ["#ff4d82", "#ff8fab", "#ffd166", "#a8e6cf", "#cdb4db", "#ff9ebb"];

    function launchConfetti(count = 110) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: canvas.width * (0.25 + Math.random() * 0.5),
          y: canvas.height * 0.35,
          vx: (Math.random() - 0.5) * 11,
          vy: -4 - Math.random() * 9,
          size: 6 + Math.random() * 7,
          color: palette[Math.floor(Math.random() * palette.length)],
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22,
          gravity: 0.22 + Math.random() * 0.08,
          drag: 0.985,
          alpha: 1,
          shape: Math.random() > 0.45 ? "rect" : "circle"
        });
      }
      if (!animId) loopConfetti();
    }

    function loopConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.alpha > 0.02 && p.y < canvas.height + 40);

      for (const p of particles) {
        p.vx *= p.drag;
        p.vy = p.vy * p.drag + p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vRot;
        if (p.y > canvas.height * 0.78) {
          p.alpha -= 0.025;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;

        if (p.shape === "rect") {
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (particles.length > 0) {
        animId = requestAnimationFrame(loopConfetti);
      } else {
        animId = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // Open gift action
    let openedOnce = false;
    openGiftBtn.addEventListener("click", () => {
      if (openedOnce) return;
      openedOnce = true;

      document.body.classList.remove("gift-locked");
      document.body.classList.add("opened");

      if (ytPlayer) {
        ytPlayer.src = "https://www.youtube.com/embed/B8XcrauYovA?autoplay=1&loop=1&playlist=B8XcrauYovA";
      }

      launchConfetti(130);

      setTimeout(() => {
        document.body.classList.add("card-visible");
        typeLetter();
      }, 220);
    });

    celebrateBtn.addEventListener("click", () => {
      launchConfetti(90);
      showToast("Semoga harimu makin ceria! 🎉");
    });

    replayBtn.addEventListener("click", () => {
      typeLetter();
      showToast("Memutar ulang pesan...");
    });
  </script>
</body>
</html>
